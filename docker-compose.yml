services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: ${CONTAINER_NAME}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./server:/app                  # Live reload del código fuente
      - ./storage:/storage             # Persistencia de fotos de evidencia
    env_file:
      - .env                           # Variables de entorno globales (API_KEY)
    environment:
      - TZ=America/Lima
    restart: unless-stopped